apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eduos-platform
  namespace: eduos-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
    - hosts:
        - eduos.com
        - www.eduos.com
        - blue.eduos.com
        - green.eduos.com
      secretName: eduos-tls-cert
  rules:
    - host: eduos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduos-platform
                port:
                  number: 3000
    - host: www.eduos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduos-platform
                port:
                  number: 3000
    - host: blue.eduos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduos-platform-blue
                port:
                  number: 3000
    - host: green.eduos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduos-platform-green
                port:
                  number: 3000
