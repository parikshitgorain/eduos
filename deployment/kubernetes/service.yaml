apiVersion: v1
kind: Service
metadata:
  name: eduos-platform
  namespace: eduos-production
  labels:
    app: eduos-platform
spec:
  type: LoadBalancer
  selector:
    app: eduos-platform
    # color selector will be updated during traffic switch
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 3000
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: eduos-platform-blue
  namespace: eduos-production
  labels:
    app: eduos-platform
    color: blue
spec:
  type: ClusterIP
  selector:
    app: eduos-platform
    color: blue
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: eduos-platform-green
  namespace: eduos-production
  labels:
    app: eduos-platform
    color: green
spec:
  type: ClusterIP
  selector:
    app: eduos-platform
    color: green
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
