# Application-level alert rules for EduOS Platform
# Monitors API latency, error rates, and service health

groups:
  - name: application_alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) * 100 > 1
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High error rate in {{ $labels.service }}"
          description: "Error rate is above 1% (current value: {{ $value }}%)"

      # Critical error rate alert
      - alert: CriticalErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Critical error rate in {{ $labels.service }}"
          description: "Error rate is above 5% (current value: {{ $value }}%)"

      # High API latency (p95)
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High API latency in {{ $labels.service }}"
          description: "P95 latency is above 500ms (current value: {{ $value }}s)"

      # Critical API latency (p95)
      - alert: CriticalAPILatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 2
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Critical API latency in {{ $labels.service }}"
          description: "P95 latency is above 2s (current value: {{ $value }}s)"

      # High request rate
      - alert: HighRequestRate
        expr: sum(rate(http_requests_total[5m])) by (service) > 1000
        for: 5m
        labels:
          severity: info
          component: application
        annotations:
          summary: "High request rate in {{ $labels.service }}"
          description: "Request rate is above 1000 req/s (current value: {{ $value }} req/s)"

      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolExhaustion
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Connection pool usage is above 80% (current value: {{ $value }}%)"

      # Redis memory usage
      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is above 80% (current value: {{ $value }}%)"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(redis_keyspace_hits_total[5m]))
            /
            (sum(rate(redis_keyspace_hits_total[5m])) + sum(rate(redis_keyspace_misses_total[5m])))
          ) * 100 < 95
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is below 95% (current value: {{ $value }}%)"

      # AI service high inference latency
      - alert: HighAIInferenceLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_inference_duration_seconds_bucket[5m])) by (le, model)
          ) > 1
        for: 5m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "High AI inference latency for {{ $labels.model }}"
          description: "P95 inference latency is above 1s (current value: {{ $value }}s)"
