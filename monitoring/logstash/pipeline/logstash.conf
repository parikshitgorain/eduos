# Logstash pipeline configuration for EduOS Platform
# Processes logs from all services and sends to Elasticsearch

input {
  # Receive logs from Filebeat
  beats {
    port => 5044
    codec => json
  }

  # Receive logs via TCP (for direct application logging)
  tcp {
    port => 5000
    codec => json_lines
  }

  # Receive logs via UDP (for syslog)
  udp {
    port => 5001
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Extract timestamp
  if [parsed][timestamp] {
    date {
      match => ["[parsed][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add service metadata
  if [parsed][service] {
    mutate {
      add_field => { "service" => "%{[parsed][service]}" }
    }
  }

  # Add tenant context
  if [parsed][tenant_id] {
    mutate {
      add_field => { "tenant_id" => "%{[parsed][tenant_id]}" }
    }
  }

  # Add user context
  if [parsed][user_id] {
    mutate {
      add_field => { "user_id" => "%{[parsed][user_id]}" }
    }
  }

  # Parse log level
  if [parsed][level] {
    mutate {
      add_field => { "level" => "%{[parsed][level]}" }
      uppercase => ["level"]
    }
  }

  # Extract error details
  if [parsed][error] {
    mutate {
      add_field => {
        "error_message" => "%{[parsed][error][message]}"
        "error_stack" => "%{[parsed][error][stack]}"
      }
    }
  }

  # Extract HTTP request details
  if [parsed][req] {
    mutate {
      add_field => {
        "http_method" => "%{[parsed][req][method]}"
        "http_url" => "%{[parsed][req][url]}"
        "http_status" => "%{[parsed][res][statusCode]}"
        "http_duration" => "%{[parsed][responseTime]}"
      }
    }
  }

  # Add geo-location for IP addresses
  if [parsed][ip] {
    geoip {
      source => "[parsed][ip]"
      target => "geoip"
    }
  }

  # Tag security-related logs
  if [parsed][security] or [level] == "SECURITY" {
    mutate {
      add_tag => ["security"]
    }
  }

  # Tag audit logs
  if [parsed][audit] or [service] == "audit" {
    mutate {
      add_tag => ["audit"]
    }
  }

  # Tag error logs
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_tag => ["error"]
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["parsed", "message"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "eduos-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    template_name => "eduos-logs"
    template_overwrite => true
  }

  # Send errors to separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "eduos-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Send audit logs to separate index
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "eduos-audit-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Send security logs to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "eduos-security-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Debug output (optional - comment out in production)
  # stdout { codec => rubydebug }
}
